<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專屬電子寵物</title>
    <style>
        :root {
            --primary-color: #ff85a1;
            --secondary-color: #ffb3c6;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #5a4a42;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #f0f4ff 100%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        /* 擬真電子機外殼 */
        .tamagotchi-shell {
            background: linear-gradient(145deg, #ffffff, #f8d7e3);
            border: 6px solid #ff9ebb;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(255, 133, 161, 0.3), inset 0 5px 10px rgba(255,255,255,0.8);
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }

        .game-container {
            width: 100%;
            background: #fdfbf7;
            border-radius: 24px;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 3px solid #f2d0db;
            display: flex;
            flex-direction: column;
            height: 520px;
        }

        .screen {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-y: auto;
            position: relative;
        }

        .hidden {
            display: none !important;
        }

        /* 歡迎/創角畫面 */
        .welcome-screen h1 {
            color: var(--primary-color);
            font-size: 22px;
            margin-bottom: 5px;
            text-align: center;
        }

        .welcome-screen p {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 15px;
        }

        .pet-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .pet-option {
            background: #fff;
            border: 3px solid #eee;
            border-radius: 16px;
            padding: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            width: 85px;
        }

        .pet-option.selected {
            border-color: var(--primary-color);
            background: var(--bg-color);
            transform: scale(1.05);
        }

        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            background: linear-gradient(135deg, #ff85a1, #ff6584);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 101, 132, 0.4);
            transition: transform 0.1s, background 0.2s;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* 遊戲主畫面數值區 */
        .status-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(255, 240, 243, 0.8);
            padding: 10px;
            border-radius: 14px;
            box-sizing: border-box;
            border: 1px solid #ffd6e0;
        }

        .status-bar-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-bar {
            flex: 1;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }

        .status-fill {
            height: 100%;
            width: 100%;
            background: #4caf50;
            transition: width 0.3s, background 0.3s;
        }

        /* 寵物舞台與動態 */
        .pet-stage {
            text-align: center;
            margin: 5px 0;
            position: relative;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(245,240,245,0.5) 100%);
            border-radius: 20px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
        }

        .pet-avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        .pet-avatar {
            font-size: 70px;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
            animation: bounce 2.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
        }

        .pet-avatar:active {
            transform: scale(1.2) rotate(8deg);
        }

        /* 睡覺時的可愛 Zzz 動態 */
        .sleeping-z {
            position: absolute;
            top: -10px;
            right: -15px;
            font-size: 20px;
            color: #7b9acc;
            font-weight: bold;
            animation: floatZ 1.5s ease-in-out infinite;
            display: none;
        }

        @keyframes floatZ {
            0% { transform: translateY(0) scale(0.8); opacity: 0.5; }
            50% { transform: translateY(-10px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-20px) scale(1); opacity: 0; }
        }

        .pet-name-tag {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 4px;
        }

        .pet-message {
            background: white;
            border: 2px solid var(--secondary-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            margin-top: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            min-height: 18px;
            text-align: center;
        }

        /* 控制面板按鈕 */
        .action-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 5px;
        }

        .action-btn {
            background: white;
            border: 2px solid #ffccd5;
            padding: 9px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .action-btn:hover {
            background: var(--bg-color);
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        /* 選單彈窗 */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: white;
            padding: 18px;
            border-radius: 20px;
            width: 75%;
            max-width: 260px;
            text-align: center;
            border: 3px solid var(--primary-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 7px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-cancel { background: #e0e0e0; color: #555; }

        /* 小遊戲畫面 */
        #game-canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            display: none;
            z-index: 50;
            padding: 15px;
            box-sizing: border-box;
        }

        .falling-item {
            position: absolute;
            font-size: 28px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
    </style>
</head>
<body>

    <div class="tamagotchi-shell">
        <div class="game-container">
            <!-- 畫面一：創角與命名 -->
            <div id="setup-screen" class="screen">
                <div style="width: 100%;">
                    <h1>🐣 打造專屬電子寵物</h1>
                    <p>幫牠選個外觀，並取個好名字吧！</p>
                    
                    <div style="font-weight: bold; font-size: 13px; margin-bottom: 6px;">選擇外觀：</div>
                    <div class="pet-selector">
                        <div class="pet-option selected" onclick="selectPetType('🐥', '小雞', '#ff85a1', '#ffb3c6', '#fff0f3')" data-type="0">
                            <div style="font-size: 32px;">🐥</div>
                            <div style="font-size: 11px;">萌萌小雞</div>
                        </div>
                        <div class="pet-option" onclick="selectPetType('🐰', '小兔', '#73c2fb', '#b5e2fa', '#f0f8ff')" data-type="1">
                            <div style="font-size: 32px;">🐰</div>
                            <div style="font-size: 11px;">軟萌小兔</div>
                        </div>
                        <div class="pet-option" onclick="selectPetType('🐱', '小貓', '#ffb347', '#ffdab9', '#fffaf0')" data-type="2">
                            <div style="font-size: 32px;">🐱</div>
                            <div style="font-size: 11px;">Ｑ彈小貓</div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="pet-name-input">寵物名字：</label>
                        <input type="text" id="pet-name-input" placeholder="輸入名字..." maxlength="10">
                    </div>
                </div>

                <button class="btn" onclick="initGame()">開始領養！ 🎉</button>
            </div>

            <!-- 畫面二：遊戲主畫面 -->
            <div id="main-screen" class="screen hidden">
                <!-- 狀態列 -->
                <div class="status-header">
                    <div class="status-bar-container">
                        <span>💖 飽足</span>
                        <div class="status-bar"><div id="bar-hunger" class="status-fill"></div></div>
                    </div>
                    <div class="status-bar-container">
                        <span>⭐ 快樂</span>
                        <div class="status-bar"><div id="bar-happy" class="status-fill"></div></div>
                    </div>
                    <div class="status-bar-container">
                        <span>💤 體力</span>
                        <div class="status-bar"><div id="bar-energy" class="status-fill"></div></div>
                    </div>
                    <div class="status-bar-container">
                        <span>🧼 清潔</span>
                        <div class="status-bar"><div id="bar-clean" class="status-fill"></div></div>
                    </div>
                </div>

                <!-- 寵物互動區 -->
                <div class="pet-stage">
                    <div class="pet-avatar-wrapper">
                        <div id="pet-avatar" class="pet-avatar" onclick="petClick()">🐥</div>
                        <div id="sleeping-z" class="sleeping-z">💤 Zzz</div>
                    </div>
                    <div id="pet-name-display" class="pet-name-tag">寶貝</div>
                    <div id="pet-message" class="pet-message">今天也要開心玩耍唷！</div>
                </div>

                <!-- 接星星小遊戲畫面 -->
                <div id="game-canvas-container">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <span style="font-size: 13px; font-weight: bold; color: #ff6584;">⭐ 點擊落下的小星星！</span>
                        <span style="font-size: 13px; font-weight: bold;">得分：<span id="game-score">0</span></span>
                    </div>
                    <div id="game-play-area" style="position: relative; width: 100%; height: 190px; background: #fff8fa; border-radius: 12px; border: 2px dashed #ffccd5; overflow: hidden;"></div>
                </div>

                <!-- 操作按鈕 -->
                <div class="action-panel">
                    <button class="action-btn" onclick="openFeedMenu()">🍓 餵食</button>
                    <button class="action-btn" onclick="startMiniGame()">🎮 玩遊戲</button>
                    <button class="action-btn" onclick="toggleSleep()">💤 睡覺</button>
                    <button class="action-btn" onclick="cleanPoop()">🧹 打掃</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 餵食選單 Modal -->
    <div id="feed-modal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin: 0 0 10px 0; font-size: 16px; color: var(--primary-color);">選擇食物 🍓</h3>
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <button class="action-btn" onclick="feedPet(15, '蛋糕 🍰')">🍰 精緻小蛋糕 (+15)</button>
                <button class="action-btn" onclick="feedPet(10, '草莓 🍓')">🍓 新鮮草莓 (+10)</button>
                <button class="action-btn" onclick="feedPet(5, '青菜 🥬')">🥬 健康蔬菜 (+5)</button>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeFeedMenu()">返回</button>
            </div>
        </div>
    </div>

    <script>
        let pet = {
            name: "寶貝",
            avatar: "🐥",
            hunger: 80,
            happy: 80,
            energy: 80,
            clean: 80,
            isSleeping: false,
            primaryColor: "#ff85a1",
            secondaryColor: "#ffb3c6",
            bgColor: "#fff0f3"
        };

        let selectedAvatar = "🐥";
        let selectedName = "小雞";
        let pColor = "#ff85a1";
        let sColor = "#ffb3c6";
        let bColor = "#fff0f3";

        function selectPetType(avatar, name, primary, secondary, bg) {
            selectedAvatar = avatar;
            selectedName = name;
            pColor = primary;
            sColor = secondary;
            bColor = bg;
            document.querySelectorAll('.pet-option').forEach(el => el.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
        }

        function initGame() {
            const inputName = document.getElementById('pet-name-input').value.trim();
            pet.name = inputName || selectedName;
            pet.avatar = selectedAvatar;
            pet.primaryColor = pColor;
            pet.secondaryColor = sColor;
            pet.bgColor = bColor;

            document.documentElement.style.setProperty('--primary-color', pet.primaryColor);
            document.documentElement.style.setProperty('--secondary-color', pet.secondaryColor);
            document.documentElement.style.setProperty('--bg-color', pet.bgColor);

            saveData();
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            updateUI();
        }

        function updateUI() {
            document.getElementById('bar-hunger').style.width = pet.hunger + '%';
            document.getElementById('bar-happy').style.width = pet.happy + '%';
            document.getElementById('bar-energy').style.width = pet.energy + '%';
            document.getElementById('bar-clean').style.width = pet.clean + '%';

            setBarColor('bar-hunger', pet.hunger);
            setBarColor('bar-happy', pet.happy);
            setBarColor('bar-energy', pet.energy);
            setBarColor('bar-clean', pet.clean);

            document.getElementById('pet-name-display').innerText = pet.name;
            document.getElementById('pet-avatar').innerText = pet.avatar;
            
            const zzz = document.getElementById('sleeping-z');
            if (pet.isSleeping) {
                zzz.style.display = 'block';
                document.getElementById('pet-avatar').style.opacity = '0.7';
            } else {
                zzz.style.display = 'none';
                document.getElementById('pet-avatar').style.opacity = '1';
            }
        }

        function setBarColor(barId, value) {
            const el = document.getElementById(barId);
            if (value > 50) el.style.background = '#4caf50';
            else if (value > 20) el.style.background = '#ff9800';
            else el.style.background = '#f44336';
        }

        function petClick() {
            if (pet.isSleeping) {
                showMsg('Zzz... 牠正在睡覺別吵醒牠！');
                return;
            }
            pet.happy = Math.min(100, pet.happy + 3);
